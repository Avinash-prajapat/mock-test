<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test - MockTest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#7c5cff">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0a0a0f;
        --bg-2: #12121a;
        --text: #ffffff;
        --muted: rgba(255,255,255,0.65);
        --muted-2: rgba(255,255,255,0.45);
        --accent-1: #7c5cff;
        --accent-2: #22d3ee;
        --glass: rgba(255,255,255,0.04);
        --glass-border: rgba(255,255,255,0.08);
        --card-hover: rgba(255,255,255,0.07);
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
    }

    html, body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    .btn-spinner {
        display: inline-block;
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bg-wrap {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background:
            radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,0.15), transparent 60%),
            radial-gradient(900px 500px at -10% 30%, rgba(34,211,238,0.1), transparent 60%),
            var(--bg);
    }
    .grid-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }

    .navbar {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(10,10,15,0.7);
        border-bottom: 1px solid var(--glass-border);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
    }
    .brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        cursor: pointer;
        transition: transform 0.2s;
        flex: 1;
        min-width: 180px;
    }
    .brand:hover { transform: scale(1.03); }
    .brand-logo {
        width: 34px; height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        display: grid; place-items: center;
        font-size: 1rem;
        box-shadow: 0 4px 16px rgba(124,92,255,0.4);
        overflow: hidden;
        flex-shrink: 0;
    }
    .brand-logo img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
    }
    .brand-text {
        background: linear-gradient(90deg, #fff, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
    }

    .navbar-right {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        flex-wrap: wrap;
    }

    .progress-badge {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
    }
    .progress-badge .progress-num {
        color: var(--accent-2);
        font-weight: 700;
        font-size: 0.95rem;
    }
    .progress-badge .progress-sep {
        opacity: 0.4;
        margin: 0 2px;
    }
    .progress-badge .flag-num {
        color: var(--warning);
        font-weight: 700;
        font-size: 0.95rem;
    }

    .timer {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.2rem;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        font-weight: 700;
        font-size: 1.1rem;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        transition: all 0.3s ease;
        white-space: nowrap;
    }
    .timer.warning {
        background: rgba(245,158,11,0.15);
        border-color: rgba(245,158,11,0.4);
        color: var(--warning);
        box-shadow: 0 0 20px rgba(245,158,11,0.2);
    }
    .timer.danger {
        background: rgba(239,68,68,0.2);
        border-color: rgba(239,68,68,0.5);
        color: #fca5a5;
        box-shadow: 0 0 25px rgba(239,68,68,0.3);
        animation: pulse-danger 1s ease-in-out infinite;
    }
    @keyframes pulse-danger {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
    }

    .container {
        max-width: 1100px;
        margin: 2rem auto;
        padding: 0 1.5rem;
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 1.5rem;
        align-items: start;
        animation: fadeUp 0.6s ease;
    }

    .question-nav {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 1.2rem;
        backdrop-filter: blur(10px);
        position: sticky;
        top: 85px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
    }
    .question-nav::-webkit-scrollbar { width: 6px; }
    .question-nav::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
    }
    .nav-title {
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 1rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }
    .nav-legend {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        font-size: 0.75rem;
        color: var(--muted-2);
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--glass-border);
    }
    .nav-legend span {
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .legend-dot {
        width: 10px; height: 10px;
        border-radius: 3px;
        display: inline-block;
        flex-shrink: 0;
    }
    .legend-dot.answered { background: linear-gradient(135deg, var(--accent-1), #5b8cff); }
    .legend-dot.flagged { background: rgba(245,158,11,0.8); }
    .legend-dot.notanswered { background: var(--glass); border: 1px solid var(--glass-border); }

    .nav-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.6rem;
    }
    .q-btn {
        aspect-ratio: 1;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--muted);
        transition: all 0.2s ease;
        font-family: inherit;
        position: relative;
    }
    .q-btn:hover {
        background: var(--card-hover);
        border-color: var(--accent-2);
        color: var(--text);
    }
    .q-btn.answered {
        background: linear-gradient(135deg, var(--accent-1), #5b8cff);
        color: white;
        border-color: transparent;
        box-shadow: 0 4px 12px rgba(124,92,255,0.3);
    }
    .q-btn.flagged {
        border-color: var(--warning);
        background: rgba(245,158,11,0.15);
        color: #fcd34d;
    }
    .q-btn.flagged.answered {
        background: linear-gradient(135deg, var(--warning), #d97706);
        color: white;
    }
    .q-btn.flagged::after {
        content: "🚩";
        position: absolute;
        top: -4px;
        right: -4px;
        font-size: 0.65rem;
        line-height: 1;
    }
    .q-btn.active {
        border-color: var(--accent-2);
        box-shadow: 0 0 0 2px rgba(34,211,238,0.3);
        color: var(--text);
        transform: scale(1.05);
    }

    .question-area {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 2rem;
        backdrop-filter: blur(10px);
    }
    .question-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        gap: 1rem;
        flex-wrap: wrap;
    }
    .q-counter {
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 600;
    }
    .flag-btn {
        padding: 0.5rem 1rem;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 600;
        font-family: inherit;
        color: var(--muted);
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 0.4rem;
    }
    .flag-btn:hover {
        background: var(--card-hover);
        color: var(--text);
        border-color: rgba(255,255,255,0.18);
    }
    .flag-btn.active {
        background: rgba(245,158,11,0.15);
        border-color: var(--warning);
        color: #fcd34d;
    }
    .flag-btn:active { transform: scale(0.95); }

    .q-text {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 1.8rem;
        line-height: 1.6;
        color: var(--text);
    }
    .option {
        padding: 1.1rem 1.3rem;
        border: 1px solid var(--glass-border);
        background: var(--glass);
        border-radius: 12px;
        margin-bottom: 0.8rem;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        gap: 1rem;
        align-items: flex-start;
    }
    .option:hover {
        background: var(--card-hover);
        border-color: rgba(255,255,255,0.2);
        transform: translateX(4px);
    }
    .option.selected {
        border-color: var(--accent-1);
        background: rgba(124,92,255,0.12);
        box-shadow: 0 0 0 1px var(--accent-1), 0 4px 16px rgba(124,92,255,0.15);
    }
    .option-letter {
        font-weight: 700;
        color: var(--accent-2);
        min-width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(34,211,238,0.1);
        border-radius: 6px;
        font-size: 0.85rem;
        transition: all 0.25s ease;
        flex-shrink: 0;
    }
    .option.selected .option-letter {
        background: var(--accent-1);
        color: white;
    }
    .option-text {
        padding-top: 2px;
        line-height: 1.5;
        color: var(--text);
    }

    .controls {
        display: flex;
        justify-content: space-between;
        margin-top: 2rem;
        gap: 1rem;
        flex-wrap: wrap;
        padding-top: 1.5rem;
        border-top: 1px solid var(--glass-border);
    }
    .controls button {
        padding: 0.8rem 1.5rem;
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        background: var(--glass);
        color: var(--text);
        cursor: pointer;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: inherit;
        transition: all 0.25s ease;
    }
    .controls button:hover:not(:disabled) {
        background: var(--card-hover);
        border-color: rgba(255,255,255,0.2);
        transform: translateY(-2px);
    }
    .controls button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        transform: none;
    }
    .controls .submit-btn {
        background: linear-gradient(135deg, var(--success), #059669);
        border-color: transparent;
        color: white;
        box-shadow: 0 8px 24px rgba(16,185,129,0.3);
        position: relative;
        overflow: hidden;
    }
    .controls .submit-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
    }
    .controls .submit-btn:hover:not(:disabled)::before {
        transform: translateX(100%);
    }
    .controls .submit-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(16,185,129,0.45);
    }

    .loading {
        grid-column: 1 / -1;
        text-align: center;
        padding: 4rem;
        color: var(--muted);
        font-size: 1.1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }
    .loading::before {
        content: "";
        width: 40px; height: 40px;
        border: 3px solid var(--glass-border);
        border-top-color: var(--accent-1);
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
        .navbar { padding: 0.9rem 1rem; }
        .brand-text { display: none; }
        .progress-badge { padding: 0.5rem 0.8rem; font-size: 0.8rem; }
        .timer { padding: 0.5rem 0.9rem; font-size: 1rem; }
        .container {
            grid-template-columns: 1fr;
            padding: 0 1rem;
            margin: 1rem auto;
        }
        .question-nav {
            position: sticky;
            top: 65px;
            z-index: 10;
            order: -1;
            max-height: none;
        }
        .nav-legend { display: none; }
        .nav-grid {
            display: flex;
            overflow-x: auto;
            gap: 0.5rem;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }
        .nav-grid::-webkit-scrollbar { display: none; }
        .q-btn {
            min-width: 42px;
            flex-shrink: 0;
        }
        .question-area { padding: 1.5rem; }
        .q-text { font-size: 1.1rem; }
        .controls { justify-content: stretch; }
        .controls button { flex: 1; text-align: center; }
    }

    .start-overlay, .resume-overlay {
        position: fixed; inset: 0; z-index: 999999;
        background: rgba(0,0,0,0.95); color: white;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center; padding: 2rem;
    }
    .start-overlay .big-icon,
    .resume-overlay .big-icon {
        font-size: 4rem; margin-bottom: 1rem;
    }
    .start-overlay h2,
    .resume-overlay h2 {
        font-size: 1.6rem; margin-bottom: 0.6rem; font-weight: 700;
    }
    .start-overlay p,
    .resume-overlay p {
        opacity: 0.8; margin-bottom: 2rem; max-width: 420px; line-height: 1.6;
    }
    .start-overlay button,
    .resume-overlay button {
        padding: 1rem 2.5rem;
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        border: none; border-radius: 12px;
        font-size: 1rem; font-weight: 600;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(16,185,129,0.4);
        transition: transform 0.2s;
        font-family: inherit;
    }
    .start-overlay button:hover,
    .resume-overlay button:hover {
        transform: translateY(-2px);
    }
    .resume-overlay button {
        background: linear-gradient(135deg, #7c5cff, #5b8cff);
        box-shadow: 0 8px 24px rgba(124,92,255,0.4);
    }
    .resume-overlay .resume-hint {
        margin-top: 1rem;
        font-size: 0.85rem;
        opacity: 0.6;
    }

    /* ============================================================
       CUSTOM CONFIRM POPUP
       ============================================================ */
    .popup-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.75);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999999;
        padding: 1rem;
        opacity: 0;
        transition: opacity 0.25s ease;
    }
    .popup-overlay.active { display: flex; opacity: 1; }
    .popup {
        background: #12121a;
        width: 100%;
        max-width: 400px;
        padding: 2rem;
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 25px 70px rgba(0,0,0,0.6);
        text-align: center;
        position: relative;
        overflow: hidden;
        animation: popupIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .popup::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(124,92,255,0.6), transparent);
    }
    @keyframes popupIn {
        from { opacity: 0; transform: scale(0.9) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .popup-icon {
        width: 64px; height: 64px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-size: 1.8rem;
        margin: 0 auto 1.2rem;
    }
    .popup-icon.danger {
        background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(239,68,68,0.1));
        border: 2px solid rgba(239,68,68,0.3);
        color: #fca5a5;
        box-shadow: 0 0 30px rgba(239,68,68,0.2);
    }
    .popup-icon.warning {
        background: linear-gradient(135deg, rgba(245,158,11,0.2), rgba(245,158,11,0.1));
        border: 2px solid rgba(245,158,11,0.3);
        color: #fcd34d;
        box-shadow: 0 0 30px rgba(245,158,11,0.2);
    }
    .popup-icon.info {
        background: linear-gradient(135deg, rgba(124,92,255,0.2), rgba(34,211,238,0.1));
        border: 2px solid rgba(124,92,255,0.3);
        color: #c4b5fd;
        box-shadow: 0 0 30px rgba(124,92,255,0.2);
    }
    .popup-icon.success {
        background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.1));
        border: 2px solid rgba(16,185,129,0.3);
        color: #6ee7b7;
        box-shadow: 0 0 30px rgba(16,185,129,0.2);
    }
    .popup h3 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 0.6rem;
    }
    .popup p {
        font-size: 0.95rem;
        color: rgba(255,255,255,0.65);
        line-height: 1.55;
        margin-bottom: 1.8rem;
        white-space: pre-line;
    }
    .popup-actions {
        display: flex;
        gap: 0.7rem;
    }
    .popup-actions button {
        flex: 1;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 12px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
    }
    .popup-actions .popup-cancel {
        background: rgba(255,255,255,0.04);
        color: #ffffff;
        border: 1px solid rgba(255,255,255,0.08);
    }
    .popup-actions .popup-cancel:hover {
        background: rgba(255,255,255,0.07);
        transform: translateY(-2px);
    }
    .popup-actions .popup-confirm {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        box-shadow: 0 6px 20px rgba(239,68,68,0.35);
    }
    .popup-actions .popup-confirm:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 28px rgba(239,68,68,0.5);
    }
    .popup-actions .popup-confirm.primary {
        background: linear-gradient(135deg, #7c5cff, #5b8cff);
        box-shadow: 0 6px 20px rgba(124,92,255,0.35);
    }
    .popup-actions .popup-confirm.primary:hover {
        box-shadow: 0 10px 28px rgba(124,92,255,0.5);
    }
    .popup-actions button:active { transform: scale(0.97); }
</style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="grid-overlay"></div>

<nav class="navbar">
    <div class="brand" onclick="confirmExitTest()">
        <div class="brand-logo">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='📝';">
        </div>
        <span class="brand-text" id="testTitle">Loading...</span>
    </div>
    <div class="navbar-right">
        <div class="progress-badge">
            <span class="progress-num" id="answeredCount">0</span>
            <span class="progress-sep">/</span>
            <span id="totalCount">0</span>
            <span style="opacity:0.5; margin: 0 0.3rem;">answered</span>
            <span style="color:var(--warning);" id="flagCount" title="Flagged for review">🚩 0</span>
        </div>
        <div class="timer" id="timer">⏱ --:--</div>
    </div>
</nav>

<div class="container" id="container">
    <div class="loading">Loading test environment...</div>
</div>

<!-- ============ CUSTOM CONFIRM POPUP ============ -->
<div class="popup-overlay" id="confirmPopup">
    <div class="popup">
        <div class="popup-icon danger" id="popupIcon">⚠️</div>
        <h3 id="popupTitle">Are you sure?</h3>
        <p id="popupMessage">Do you want to continue?</p>
        <div class="popup-actions">
            <button class="popup-cancel" id="popupCancelBtn">Cancel</button>
            <button class="popup-confirm" id="popupConfirmBtn">Confirm</button>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const TEST_ID = params.get('id');

    const STORAGE_KEY = 'test_autosave_' + TEST_ID;

    let questions = [];
    let currentIndex = 0;
    let answers = {};
    let flagged = {};
    let timeLeft = 30 * 60;
    let timerInterval = null;
    let submitting = false;
    let testStarted = false;
    let autoSaveInterval = null;

    // ============================================================
    // CUSTOM CONFIRM POPUP
    // ============================================================
    function showConfirm(options) {
        const overlay = document.getElementById('confirmPopup');
        const iconEl = document.getElementById('popupIcon');
        const titleEl = document.getElementById('popupTitle');
        const msgEl = document.getElementById('popupMessage');
        const cancelBtn = document.getElementById('popupCancelBtn');
        const confirmBtn = document.getElementById('popupConfirmBtn');

        titleEl.textContent = options.title || 'Are you sure?';
        msgEl.textContent = options.message || 'Do you want to continue?';
        cancelBtn.textContent = options.cancelText || 'Cancel';
        confirmBtn.textContent = options.confirmText || 'Confirm';

        iconEl.textContent = options.icon || '⚠️';
        iconEl.className = 'popup-icon ' + (options.iconType || 'danger');

        if (options.primary) confirmBtn.classList.add('primary');
        else confirmBtn.classList.remove('primary');

        overlay.classList.add('active');

        const newCancel = cancelBtn.cloneNode(true);
        const newConfirm = confirmBtn.cloneNode(true);
        cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
        confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

        const close = () => overlay.classList.remove('active');

        newCancel.onclick = () => {
            close();
            if (options.onCancel) options.onCancel();
        };
        newConfirm.onclick = () => {
            close();
            if (options.onConfirm) options.onConfirm();
        };

        overlay.onclick = (e) => {
            if (e.target === overlay) {
                close();
                if (options.onCancel) options.onCancel();
            }
        };

        const escHandler = (e) => {
            if (e.key === 'Escape') {
                close();
                document.removeEventListener('keydown', escHandler);
                if (options.onCancel) options.onCancel();
            }
        };
        document.addEventListener('keydown', escHandler);
    }

    // ============================================================
    // SESSION STORAGE
    // ============================================================
    function saveState() {
        if (!testStarted || submitting) return;
        try {
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
                answers: answers,
                flagged: flagged,
                currentIndex: currentIndex,
                timeLeft: timeLeft,
                savedAt: Date.now()
            }));
        } catch (e) {
            console.warn('[AUTOSAVE] Failed:', e);
        }
    }

    function loadState() {
        try {
            const saved = sessionStorage.getItem(STORAGE_KEY);
            if (!saved) return false;
            const state = JSON.parse(saved);
            answers = state.answers || {};
            flagged = state.flagged || {};
            currentIndex = state.currentIndex || 0;
            if (typeof state.timeLeft === 'number' && state.timeLeft > 0) {
                timeLeft = state.timeLeft;
            }
            console.log('[AUTOSAVE] Restored:', Object.keys(answers).length, 'answers,', Math.floor(timeLeft/60), 'min left');
            return true;
        } catch (e) {
            console.warn('[AUTOSAVE] Load failed:', e);
            return false;
        }
    }

    function clearState() {
        try {
            sessionStorage.removeItem(STORAGE_KEY);
            console.log('[AUTOSAVE] Cleared');
        } catch (e) {}
    }

    function startAutoSave() {
        if (autoSaveInterval) clearInterval(autoSaveInterval);
        autoSaveInterval = setInterval(saveState, 3000);
    }
    function stopAutoSave() {
        if (autoSaveInterval) {
            clearInterval(autoSaveInterval);
            autoSaveInterval = null;
        }
    }

    // ============================================================
    // FULLSCREEN
    // ============================================================
    function activateTestFullscreen() {
        sessionStorage.setItem('exam_fullscreen', '1');

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && testStarted && isFsEnabled()) {
                showResumeOverlay();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!isFsEnabled()) return;
            if (e.key === 'Escape' || e.key === 'F11') e.preventDefault();
            if (e.ctrlKey && ['w', 'r', 't', 'n'].includes(e.key.toLowerCase())) e.preventDefault();
            if (e.altKey && e.key === 'F4') e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
        }, true);

        document.addEventListener('contextmenu', (e) => {
            if (isFsEnabled()) e.preventDefault();
        });
        document.addEventListener('copy', (e) => {
            if (isFsEnabled()) e.preventDefault();
        });
        document.addEventListener('cut', (e) => {
            if (isFsEnabled()) e.preventDefault();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isFsEnabled()) {
                console.warn('⚠️ Tab switch detected!');
            }
        });
    }

    function showResumeOverlay() {
        if (document.getElementById('fs-resume-overlay')) return;
        if (document.fullscreenElement) return;

        const overlay = document.createElement('div');
        overlay.id = 'fs-resume-overlay';
        overlay.className = 'resume-overlay';
        overlay.innerHTML = `
            <div class="big-icon">⛶</div>
            <h2>Fullscreen Mode Required</h2>
            <p>You must stay in fullscreen mode during the test.<br><strong>Click below to resume.</strong></p>
            <button id="resumeTestBtn">Resume Test in Fullscreen</button>
            <div class="resume-hint">Your answers are automatically saved ✓</div>
        `;
        document.body.appendChild(overlay);

        document.getElementById('resumeTestBtn').onclick = async () => {
            const ok = await goFullscreen();
            if (ok) overlay.remove();
        };
    }

    function showStartOverlay() {
        const overlay = document.createElement('div');
        overlay.id = 'start-overlay';
        overlay.className = 'start-overlay';

        const hasSaved = !!sessionStorage.getItem(STORAGE_KEY);

        overlay.innerHTML = `
            <div class="big-icon">⛶</div>
            <h2>${hasSaved ? 'Resume Test?' : 'Ready to Start Test?'}</h2>
            <p>
                ${hasSaved
                    ? 'We found your previous progress.<br>The test will open in <strong>fullscreen mode</strong>.'
                    : 'The test will open in <strong>fullscreen mode</strong>.<br>You must stay in fullscreen during the test.'}
            </p>
            <button id="startTestBtn">${hasSaved ? 'Resume Test' : 'Start Test in Fullscreen'}</button>
            ${hasSaved ? '<div style="margin-top:1rem;font-size:0.85rem;opacity:0.6;"><button id="freshStartBtn" style="background:transparent;border:1px solid rgba(255,255,255,0.2);color:#fca5a5;padding:0.5rem 1rem;font-size:0.8rem;cursor:pointer;border-radius:8px;">Start Fresh (clear progress)</button></div>' : ''}
        `;
        document.body.appendChild(overlay);

        document.getElementById('startTestBtn').onclick = async () => {
            const ok = await goFullscreen();
            if (ok) {
                testStarted = true;
                overlay.remove();

                if (hasSaved) loadState();

                loadTestData();
                startAutoSave();
            } else {
                showToastError('Fullscreen is required. Please allow fullscreen and try again.');
            }
        };

        const freshBtn = document.getElementById('freshStartBtn');
        if (freshBtn) {
            freshBtn.onclick = (e) => {
                e.stopPropagation();
                showConfirm({
                    title: 'Start Fresh?',
                    message: 'This will clear your previous progress. You will start the test from the beginning.',
                    confirmText: 'Yes, Clear',
                    cancelText: 'Cancel',
                    icon: '🔄',
                    iconType: 'warning',
                    onConfirm: () => {
                        clearState();
                        answers = {};
                        flagged = {};
                        currentIndex = 0;
                        location.reload();
                    }
                });
            };
        }
    }

    function showToastError(msg) {
        // Simple fallback alert for fullscreen error
        alert(msg);
    }

    // ============================================================
    // CONFIRM EXIT TEST
    // ============================================================
    function confirmExitTest() {
        if (!testStarted) {
            window.location.href = 'index.html';
            return;
        }
        showConfirm({
            title: 'Leave Test?',
            message: 'Your answers are auto-saved. You can resume this test later from your dashboard.',
            confirmText: 'Yes, Leave',
            cancelText: 'Stay',
            icon: '⚠️',
            iconType: 'warning',
            onConfirm: () => {
                saveState();
                sessionStorage.removeItem('exam_fullscreen');
                if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                window.location.href = 'dashboard.html';
            }
        });
    }

    // ============================================================
    // BEFORE UNLOAD
    // ============================================================
    window.addEventListener('beforeunload', (e) => {
        if (testStarted && !submitting) {
            saveState();
            e.preventDefault();
            e.returnValue = 'Are you sure you want to leave? Your progress is saved.';
            return e.returnValue;
        }
    });

    // ============================================================
    // INIT
    // ============================================================
    (async () => {
        const user = await requireAuth();
        if (!user) return;

        if (!TEST_ID) {
            alert('No test selected');
            window.location.href = 'dashboard.html';
            return;
        }

        activateTestFullscreen();
        showStartOverlay();
    })();

    // ============================================================
    // LOAD TEST DATA
    // ============================================================
    async function loadTestData() {
        const t = await apiCall(`/api/tests/${TEST_ID}`);
        if (t.success && t.test) {
            document.getElementById('testTitle').textContent = t.test.title;
            if (!sessionStorage.getItem(STORAGE_KEY)) {
                timeLeft = (t.test.duration_minutes || 30) * 60;
            }
        }

        const data = await apiCall(`/api/tests/${TEST_ID}/questions`);
        if (!data.success || !data.questions.length) {
            alert('No questions found for this test');
            sessionStorage.removeItem('exam_fullscreen');
            clearState();
            window.location.href = 'dashboard.html';
            return;
        }

        questions = data.questions;
        if (currentIndex >= questions.length) currentIndex = 0;

        render();
        startTimer();
        updateProgress();
    }

    // ============================================================
    // RENDER
    // ============================================================
    function render() {
        const container = document.getElementById('container');
        container.innerHTML = `
            <div class="question-nav">
                <div class="nav-title">Questions</div>
                <div class="nav-legend">
                    <span><span class="legend-dot answered"></span> Answered</span>
                    <span><span class="legend-dot flagged"></span> Flagged for review</span>
                    <span><span class="legend-dot notanswered"></span> Not answered</span>
                </div>
                <div class="nav-grid" id="navGrid"></div>
            </div>
            <div class="question-area">
                <div class="question-header">
                    <div class="q-counter" id="qCounter">Question 1 of 1</div>
                    <button class="flag-btn" id="flagBtn" title="Flag for review">
                        <span id="flagIcon">🚩</span> <span id="flagText">Flag for review</span>
                    </button>
                </div>
                <div id="qBox"></div>
                <div class="controls">
                    <button id="prevBtn">← Prev</button>
                    <button id="nextBtn">Next →</button>
                    <button id="submitBtn" class="submit-btn">Submit Test</button>
                </div>
            </div>
        `;

        renderNav();
        renderQuestion();

        document.getElementById('prevBtn').onclick = () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderNav();
                renderQuestion();
                saveState();
            }
        };
        document.getElementById('nextBtn').onclick = () => {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderNav();
                renderQuestion();
                saveState();
            }
        };
        document.getElementById('submitBtn').onclick = () => {
            const unanswered = questions.length - Object.keys(answers).length;
            const flaggedCount = Object.keys(flagged).length;
            let msg = '';
            if (unanswered > 0) msg += `You have ${unanswered} unanswered question(s). `;
            if (flaggedCount > 0) msg += `You have ${flaggedCount} flagged question(s). `;
            msg += msg ? '\n\nDo you want to submit anyway?' : 'Are you ready to submit your test?';

            showConfirm({
                title: 'Submit Test?',
                message: msg,
                confirmText: 'Yes, Submit',
                cancelText: 'Review',
                icon: '✅',
                iconType: 'info',
                primary: true,
                onConfirm: submitTest
            });
        };

        document.getElementById('flagBtn').onclick = toggleFlag;
    }

    function renderNav() {
        const grid = document.getElementById('navGrid');
        grid.innerHTML = '';
        questions.forEach((q, i) => {
            const btn = document.createElement('button');
            btn.className = 'q-btn';
            btn.textContent = i + 1;
            if (answers[q.id]) btn.classList.add('answered');
            if (flagged[q.id]) btn.classList.add('flagged');
            if (i === currentIndex) btn.classList.add('active');
            btn.onclick = () => {
                currentIndex = i;
                renderNav();
                renderQuestion();
                saveState();
            };
            grid.appendChild(btn);
        });
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        const box = document.getElementById('qBox');
        const opts = ['A', 'B', 'C', 'D'];

        document.getElementById('qCounter').textContent = `Question ${currentIndex + 1} of ${questions.length}`;

        const flagBtn = document.getElementById('flagBtn');
        const flagIcon = document.getElementById('flagIcon');
        const flagText = document.getElementById('flagText');
        if (flagged[q.id]) {
            flagBtn.classList.add('active');
            flagIcon.textContent = '🚩';
            flagText.textContent = 'Flagged';
        } else {
            flagBtn.classList.remove('active');
            flagIcon.textContent = '⚐';
            flagText.textContent = 'Flag for review';
        }

        box.innerHTML = `
            <div class="q-text">Q${currentIndex + 1}. ${escapeHtml(q.question_text)}</div>
            ${opts.map(o => `
                <div class="option ${answers[q.id] === o ? 'selected' : ''}" data-opt="${o}">
                    <span class="option-letter">${o}</span>
                    <span class="option-text">${escapeHtml(q['option_' + o.toLowerCase()])}</span>
                </div>
            `).join('')}
        `;

        box.querySelectorAll('.option').forEach(el => {
            el.onclick = () => {
                answers[q.id] = el.dataset.opt;
                saveState();
                updateProgress();
                renderNav();
                renderQuestion();
            };
        });

        document.getElementById('prevBtn').disabled = currentIndex === 0;
        document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;
    }

    function toggleFlag() {
        const q = questions[currentIndex];
        if (flagged[q.id]) {
            delete flagged[q.id];
        } else {
            flagged[q.id] = true;
        }
        saveState();
        updateProgress();
        renderNav();
        renderQuestion();
    }

    function updateProgress() {
        const answeredCount = Object.keys(answers).length;
        const flagCount = Object.keys(flagged).length;
        document.getElementById('answeredCount').textContent = answeredCount;
        document.getElementById('totalCount').textContent = questions.length;
        document.getElementById('flagCount').textContent = `🚩 ${flagCount}`;
    }

    function startTimer() {
        const el = document.getElementById('timer');
        const update = () => {
            const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
            const s = String(timeLeft % 60).padStart(2, '0');
            el.textContent = `⏱ ${m}:${s}`;
            el.classList.remove('warning', 'danger');
            if (timeLeft <= 60) el.classList.add('danger');
            else if (timeLeft <= 300) el.classList.add('warning');
        };
        update();
        timerInterval = setInterval(() => {
            timeLeft--;
            update();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                showConfirm({
                    title: 'Time Up!',
                    message: 'Your time is up. The test will be submitted automatically.',
                    confirmText: 'OK',
                    cancelText: 'OK',
                    icon: '⏰',
                    iconType: 'warning',
                    onConfirm: submitTest,
                    onCancel: submitTest
                });
            }
        }, 1000);
    }

    async function submitTest() {
        if (submitting) return;
        submitting = true;

        clearInterval(timerInterval);
        stopAutoSave();

        sessionStorage.removeItem('exam_fullscreen');
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
        }

        const btn = document.getElementById('submitBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = `<span class="btn-spinner"></span> Submitting...`;
        }

        const data = await apiCall(`/api/tests/${TEST_ID}/submit`, {
            method: 'POST',
            body: JSON.stringify({ answers })
        });

        if (data.success) {
            clearState();
            window.location.href = `result.html?id=${data.result_id}`;
        } else {
            alert(data.error || 'Submission failed');
            submitting = false;
            sessionStorage.setItem('exam_fullscreen', '1');
            startAutoSave();
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Submit Test';
            }
        }
    }
</script>
</body>
</html>
