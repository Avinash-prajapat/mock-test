<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - MockTest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#7c5cff">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0a0a0f;
        --text: #ffffff;
        --muted: rgba(255,255,255,0.65);
        --muted-2: rgba(255,255,255,0.45);
        --accent-1: #7c5cff;
        --accent-2: #22d3ee;
        --glass: rgba(255,255,255,0.04);
        --glass-border: rgba(255,255,255,0.08);
        --input-bg: rgba(255,255,255,0.06);
        --input-border: rgba(255,255,255,0.12);
        --error: #ef4444;
        --success: #10b981;
    }

    html, body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    .bg-wrap {
        position: fixed; inset: 0; z-index: -1; overflow: hidden;
        background:
            radial-gradient(1000px 500px at 70% -10%, rgba(124,92,255,0.25), transparent 60%),
            radial-gradient(800px 450px at -10% 40%, rgba(34,211,238,0.18), transparent 60%),
            radial-gradient(700px 400px at 50% 110%, rgba(244,114,182,0.15), transparent 60%),
            var(--bg);
    }
    .grid-overlay {
        position: fixed; inset: 0; z-index: -1;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }
    .orb {
        position: fixed; border-radius: 50%; filter: blur(80px);
        opacity: 0.5; z-index: -1;
        animation: float 18s ease-in-out infinite;
    }
    .orb.o1 { width: 380px; height: 380px; background: #f59e0b; top: -100px; left: -100px; }
    .orb.o2 { width: 320px; height: 320px; background: #ef4444; bottom: 20%; right: -80px; animation-delay: -6s; }
    .orb.o3 { width: 340px; height: 340px; background: #7c5cff; bottom: -120px; left: 20%; animation-delay: -12s; }
    @keyframes float {
        0%, 100% { transform: translate(0,0) scale(1); }
        33% { transform: translate(30px,-20px) scale(1.05); }
        66% { transform: translate(-20px,30px) scale(0.95); }
    }

    .brand-bar {
        position: fixed;
        top: 1.2rem;
        left: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        transition: transform 0.2s;
        z-index: 100;
        text-decoration: none;
    }
    .brand-bar:hover { transform: scale(1.05); }
    .brand-bar-logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #f59e0b, #ef4444);
        display: grid;
        place-items: center;
        font-size: 1.1rem;
        box-shadow: 0 8px 24px rgba(239,68,68,0.3);
        position: relative;
        overflow: hidden;
    }
    .brand-bar-logo img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
    }
    .brand-bar-logo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
        transform: translateX(-100%);
        animation: shine 3.5s ease-in-out infinite;
        pointer-events: none;
    }
    @keyframes shine {
        0%, 60% { transform: translateX(-100%); }
        80%, 100% { transform: translateX(100%); }
    }
    .brand-bar-text {
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #fff, #fcd34d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        min-height: 100vh;
    }

    .box {
        width: 100%;
        max-width: 420px;
        padding: 2.5rem 2rem;
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        animation: fadeUp 0.6s ease;
        position: relative;
        overflow: hidden;
    }
    .box::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(245,158,11,0.6), transparent);
    }

    h1 {
        text-align: center;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        background: linear-gradient(90deg, #fff, #fcd34d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .subtitle {
        text-align: center;
        color: var(--muted);
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }

    .input-wrap {
        position: relative;
        margin-bottom: 1rem;
    }
    .input-wrap input {
        width: 100%;
        padding: 0.9rem 3rem 0.9rem 1rem;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 12px;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        transition: all 0.3s ease;
    }
    .input-wrap input.plain {
        padding-right: 1rem;
    }
    .input-wrap input::placeholder {
        color: var(--muted-2);
    }
    .input-wrap input:focus {
        background: rgba(255,255,255,0.08);
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245,158,11,0.15);
    }
    .eye-toggle {
        position: absolute;
        right: 0.8rem;
        top: 50%;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: transparent;
        border: none;
        color: var(--muted-2);
        cursor: pointer;
        display: grid;
        place-items: center;
        font-size: 1rem;
        transition: all 0.2s;
        font-family: inherit;
    }
    .eye-toggle:hover {
        background: rgba(255,255,255,0.06);
        color: var(--text);
    }
    .eye-toggle:active {
        transform: translateY(-50%) scale(0.9);
    }

    button.submit {
        width: 100%;
        padding: 0.95rem;
        background: linear-gradient(135deg, #f59e0b, #ef4444);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(239,68,68,0.35);
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
    }
    button.submit::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
    }
    button.submit:hover:not(:disabled)::before {
        transform: translateX(100%);
    }
    button.submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(239,68,68,0.5);
    }
    button.submit:disabled {
        opacity: 0.7;
        cursor: not-allowed;
    }
    button.submit:active:not(:disabled) {
        transform: scale(0.98);
    }

    .btn-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
        min-height: 20px;
        transition: all 0.3s ease;
        padding: 0.6rem;
        border-radius: 8px;
    }
    .msg.error {
        color: #fca5a5;
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.2);
    }
    .msg.success {
        color: #6ee7b7;
        background: rgba(16,185,129,0.1);
        border: 1px solid rgba(16,185,129,0.2);
    }
    .msg:empty {
        padding: 0;
        background: transparent;
        border: none;
    }

    .back-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
    }
    .back-link a {
        color: var(--muted);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }
    .back-link a:hover {
        color: var(--accent-2);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
        .box { padding: 2rem 1.5rem; }
        h1 { font-size: 1.5rem; }
        .brand-bar { top: 0.9rem; left: 1rem; }
        .brand-bar-logo { width: 34px; height: 34px; font-size: 0.95rem; }
        .brand-bar-text { font-size: 1rem; }
    }
</style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="grid-overlay"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<a href="index.html" class="brand-bar">
    <div class="brand-bar-logo">
        <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='🔐';">
    </div>
    <span class="brand-bar-text">Admin</span>
</a>

<div class="box">
    <h1>Admin Login</h1>
    <p class="subtitle">Restricted access — Admin only</p>

    <form id="adminLoginForm" autocomplete="on">
        <div class="input-wrap">
            <input type="email" id="email" placeholder="Admin email" required
                autocomplete="email" name="email" class="plain">
        </div>
        <div class="input-wrap">
            <input type="password" id="password" placeholder="Password" required
                autocomplete="current-password" name="password">
            <button type="button" class="eye-toggle" id="togglePassword" title="Show password">👁️</button>
        </div>

        <button type="submit" class="submit" id="loginBtn">🔐 Login as Admin</button>
        <p class="msg" id="msg"></p>
    </form>

    <div class="back-link">
        <a href="login.html">← Back to Student login</a>
    </div>
</div>

<script src="js/config.js"></script>
<script>
    // ============ PASSWORD TOGGLE ============
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    toggleBtn.onclick = () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.textContent = isPassword ? '🙈' : '👁️';
        toggleBtn.title = isPassword ? 'Hide password' : 'Show password';
    };

    // ============ ADMIN LOGIN SUBMIT ============
    document.getElementById('adminLoginForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('msg');
        const email = document.getElementById('email').value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            msg.textContent = 'Please enter email and password';
            msg.className = 'msg error';
            return;
        }

        // Loading state
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-spinner"></span> Logging in...';
        msg.textContent = '';
        msg.className = 'msg';

        const data = await apiCall('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
        });

        if (data.success) {
            // Check if admin
            const check = await apiCall('/api/admin/check');
            if (check.success && check.is_admin) {
                msg.textContent = '✓ Welcome, Admin! Redirecting...';
                msg.className = 'msg success';
                btn.innerHTML = '✓ Success';
                setTimeout(() => window.location.href = 'admin.html', 500);
            } else {
                msg.textContent = '❌ Access denied. This is not an admin account.';
                msg.className = 'msg error';
                btn.disabled = false;
                btn.innerHTML = '🔐 Login as Admin';
                await apiCall('/api/auth/logout', { method: 'POST' });
            }
        } else {
            msg.textContent = data.error || 'Login failed';
            msg.className = 'msg error';
            btn.disabled = false;
            btn.innerHTML = '🔐 Login as Admin';
        }
    };
</script>
</body>
</html>
