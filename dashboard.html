<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - MockTest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="logo.png">
<meta name="theme-color" content="#7c5cff">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0a0a0f;
        --bg-2: #12121a;
        --sidebar-bg: #0f0f17;
        --text: #ffffff;
        --muted: rgba(255,255,255,0.65);
        --muted-2: rgba(255,255,255,0.45);
        --accent-1: #7c5cff;
        --accent-2: #22d3ee;
        --glass: rgba(255,255,255,0.04);
        --glass-border: rgba(255,255,255,0.08);
        --card-hover: rgba(255,255,255,0.07);
        --input-bg: rgba(255,255,255,0.06);
        --input-border: rgba(255,255,255,0.12);
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --sidebar-width: 260px;
    }

    html, body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* ===== GLOBAL LOADER ===== */
    #globalLoader {
        position: fixed; inset: 0; z-index: 9999;
        background: rgba(10, 10, 15, 0.9);
        backdrop-filter: blur(10px);
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        gap: 1rem;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #globalLoader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-circle {
        width: 44px; height: 44px;
        border: 3px solid rgba(255,255,255,0.1);
        border-left-color: var(--accent-1);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
    }
    .loader-text { font-size: 0.9rem; color: var(--muted); font-weight: 500; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== BUTTON SPINNER ===== */
    .btn-spinner {
        display: inline-block;
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 6px;
        vertical-align: middle;
    }

    /* ===== Background ===== */
    .bg-wrap {
        position: fixed; inset: 0; z-index: -2; overflow: hidden;
        background:
            radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,0.2), transparent 60%),
            radial-gradient(900px 500px at -10% 30%, rgba(34,211,238,0.15), transparent 60%),
            radial-gradient(800px 500px at 50% 110%, rgba(244,114,182,0.12), transparent 60%),
            var(--bg);
    }
    .grid-overlay {
        position: fixed; inset: 0; z-index: -2;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }
    .orb {
        position: fixed; border-radius: 50%; filter: blur(80px);
        opacity: 0.45; z-index: -2;
        animation: float 18s ease-in-out infinite;
    }
    .orb.o1 { width: 400px; height: 400px; background: #7c5cff; top: -100px; left: -100px; }
    .orb.o2 { width: 340px; height: 340px; background: #22d3ee; top: 40%; right: -80px; animation-delay: -6s; }
    .orb.o3 { width: 360px; height: 360px; background: #f472b6; bottom: -120px; left: 30%; animation-delay: -12s; }
    @keyframes float {
        0%, 100% { transform: translate(0,0) scale(1); }
        33% { transform: translate(35px,-25px) scale(1.06); }
        66% { transform: translate(-25px,35px) scale(0.95); }
    }

    /* ====================================================
       TOP NAVBAR
       ==================================================== */
    .topbar {
        position: sticky; top: 0; z-index: 100;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        background: rgba(10,10,15,0.85);
        border-bottom: 1px solid var(--glass-border);
        padding: 0.9rem 1.5rem;
        display: flex; justify-content: space-between; align-items: center;
    }
    .topbar-left { display: flex; align-items: center; gap: 1rem; }
    .hamburger {
        width: 40px; height: 40px;
        border-radius: 10px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        display: grid; place-items: center;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--text);
        font-size: 1.2rem;
    }
    .hamburger:hover {
        background: var(--card-hover);
        border-color: rgba(255,255,255,0.18);
        transform: scale(1.05);
    }
    .hamburger:active { transform: scale(0.95); }

    /* 🔥 Brand click = page reload */
    .brand {
        display: flex; align-items: center; gap: 0.6rem;
        font-size: 1.1rem; font-weight: 800;
        cursor: pointer;
        transition: transform 0.2s;
        text-decoration: none;
        color: var(--text);
    }
    .brand:hover { transform: scale(1.03); }
    .brand-logo {
        width: 34px; height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        display: grid; place-items: center;
        font-size: 1rem;
        box-shadow: 0 4px 16px rgba(124,92,255,0.4);
        overflow: hidden;
    }
    .brand-logo img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
    }
    .brand-text {
        background: linear-gradient(90deg, #fff, #c4b5fd);
        -webkit-background-clip: text; background-clip: text;
        color: transparent;
    }

    .topbar-right { display: flex; align-items: center; gap: 0.7rem; }

    /* 🔥 User chip — clickable (opens sidebar) */
    .user-chip {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.5rem 0.9rem;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        font-size: 0.85rem;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s;
    }
    .user-chip:hover {
        background: var(--card-hover);
        border-color: rgba(255,255,255,0.18);
        transform: translateY(-1px);
    }
    .user-chip:active { transform: scale(0.98); }
    .user-chip .avatar {
        width: 26px; height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        display: grid; place-items: center;
        font-size: 0.75rem;
        color: white;
        font-weight: 700;
    }

    /* ====================================================
       SIDEBAR
       ==================================================== */
    .sidebar-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        opacity: 0; visibility: hidden;
        transition: all 0.3s ease;
        z-index: 200;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }

    .sidebar {
        position: fixed;
        top: 0; left: 0;
        width: var(--sidebar-width);
        height: 100vh;
        background: var(--sidebar-bg);
        border-right: 1px solid var(--glass-border);
        z-index: 300;
        transform: translateX(-100%);
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
        display: flex; flex-direction: column;
        overflow: hidden;  /* 🔥 Prevent body scroll */
    }
    .sidebar.active { transform: translateX(0); }

    .sidebar-header {
        padding: 1.2rem 1.4rem;
        border-bottom: 1px solid var(--glass-border);
        display: flex; align-items: center; justify-content: space-between;
        flex-shrink: 0;
    }
    .sidebar-brand {
        display: flex; align-items: center; gap: 0.6rem;
        font-size: 1rem; font-weight: 800;
        cursor: pointer;
        text-decoration: none;
        color: var(--text);
    }
    .sidebar-brand-logo {
        width: 32px; height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        display: grid; place-items: center;
        font-size: 0.95rem;
        box-shadow: 0 4px 12px rgba(124,92,255,0.4);
        overflow: hidden;
    }
    .sidebar-brand-logo img {
        width: 100%; height: 100%;
        object-fit: contain;
        display: block;
    }
    .sidebar-brand-text {
        background: linear-gradient(90deg, #fff, #c4b5fd);
        -webkit-background-clip: text; background-clip: text;
        color: transparent;
    }
    .sidebar-close {
        width: 28px; height: 28px;
        border-radius: 8px;
        background: transparent;
        border: 1px solid var(--glass-border);
        color: var(--muted);
        cursor: pointer;
        display: grid; place-items: center;
        font-size: 0.9rem;
        transition: all 0.2s;
    }
    .sidebar-close:hover {
        background: rgba(239,68,68,0.15);
        border-color: rgba(239,68,68,0.3);
        color: #fca5a5;
    }

    /* 🔥 Scrollable menu */
    .sidebar-menu {
        padding: 1rem 0.8rem;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
    }
    .sidebar-menu::-webkit-scrollbar { width: 6px; }
    .sidebar-menu::-webkit-scrollbar-track { background: transparent; }
    .sidebar-menu::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 3px;
    }
    .sidebar-menu::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.2);
    }

    .sidebar-section-title {
        font-size: 0.7rem;
        color: var(--muted-2);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.8rem 0.8rem 0.4rem;
    }
    .sidebar-item {
        display: flex; align-items: center; gap: 0.8rem;
        padding: 0.8rem 1rem;
        border-radius: 10px;
        cursor: pointer;
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 500;
        transition: all 0.2s;
        text-decoration: none;
        margin-bottom: 0.2rem;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        font-family: inherit;
    }
    .sidebar-item:hover {
        background: var(--card-hover);
        color: var(--text);
    }
    .sidebar-item.active {
        background: linear-gradient(135deg, var(--accent-1), #5b8cff);
        color: white;
        box-shadow: 0 6px 20px rgba(124,92,255,0.3);
    }
    .sidebar-item.active .sidebar-icon { color: white; }
    .sidebar-icon {
        width: 22px; height: 22px;
        display: grid; place-items: center;
        font-size: 1rem;
        color: var(--muted);
        transition: color 0.2s;
    }
    .sidebar-item:hover .sidebar-icon { color: var(--text); }

    .sidebar-footer {
        padding: 1rem 0.8rem;
        border-top: 1px solid var(--glass-border);
        flex-shrink: 0;
    }
    .sidebar-item.danger:hover {
        background: rgba(239,68,68,0.15);
        color: #fca5a5;
    }
    .sidebar-item.danger:hover .sidebar-icon { color: #fca5a5; }

    /* ====================================================
       MAIN CONTENT
       ==================================================== */
    .main-content {
        padding: 2rem 1.5rem;
        max-width: 1200px;
        margin: 0 auto;
        animation: fadeUp 0.5s ease;
    }

    .welcome-card {
        background: linear-gradient(135deg, #7c5cff 0%, #5b8cff 100%);
        border-radius: 20px;
        padding: 2rem;
        margin-bottom: 2rem;
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(124,92,255,0.3);
    }
    .welcome-card::before {
        content: "";
        position: absolute;
        top: -50%; right: -20%;
        width: 300px; height: 300px;
        background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
        border-radius: 50%;
    }
    .welcome-content { position: relative; z-index: 1; }
    .welcome-badge {
        display: inline-flex; align-items: center; gap: 0.4rem;
        padding: 0.35rem 0.8rem;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        font-size: 0.8rem;
        color: white;
        margin-bottom: 1rem;
    }
    .welcome-card h1 {
        font-size: 1.8rem;
        font-weight: 800;
        color: white;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
    }
    .welcome-card h1 span { color: #fcd34d; }
    .welcome-card p {
        color: rgba(255,255,255,0.85);
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: 600px;
    }

    .tab-panel { display: none; animation: fadeUp 0.4s ease; }
    .tab-panel.active { display: block; }

    /* ====================================================
       STATS
       ==================================================== */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
    }
    .stat-card {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        padding: 1.4rem;
        border-radius: 16px;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
    }
    .stat-card:hover {
        background: var(--card-hover);
        transform: translateY(-4px);
        border-color: rgba(255,255,255,0.15);
    }
    .stat-icon {
        width: 40px; height: 40px;
        border-radius: 10px;
        display: grid; place-items: center;
        font-size: 1.2rem;
        margin-bottom: 0.8rem;
        background: linear-gradient(135deg, rgba(124,92,255,0.2), rgba(34,211,238,0.1));
        border: 1px solid rgba(124,92,255,0.2);
    }
    .stat-value {
        font-size: 1.8rem; font-weight: 800;
        background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
        -webkit-background-clip: text; background-clip: text;
        color: transparent;
        line-height: 1;
        margin-bottom: 0.3rem;
        transition: all 0.3s ease;
    }
    .stat-label { font-size: 0.85rem; color: var(--muted); font-weight: 500; }

    /* ====================================================
       SECTION HEADER
       ==================================================== */
    .section-header {
        display: flex; justify-content: space-between;
        align-items: center;
        margin-bottom: 1.2rem;
        flex-wrap: wrap; gap: 1rem;
    }
    .section-header h2 {
        font-size: 1.3rem; font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--text);
    }

    .search-box {
        position: relative;
        flex: 1;
        max-width: 300px;
    }
    .search-box input {
        width: 100%;
        padding: 0.65rem 1rem 0.65rem 2.5rem;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        color: var(--text);
        font-size: 0.9rem;
        font-family: inherit;
        outline: none;
        transition: all 0.25s ease;
    }
    .search-box input:focus {
        border-color: var(--accent-1);
        background: rgba(124,92,255,0.06);
        box-shadow: 0 0 0 3px rgba(124,92,255,0.12);
    }
    .search-box input::placeholder { color: var(--muted-2); }
    .search-box::before {
        content: "🔍";
        position: absolute;
        left: 0.9rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.85rem;
        opacity: 0.5;
    }

    .filter-tabs {
        display: flex; gap: 0.4rem;
        background: var(--glass);
        padding: 0.3rem;
        border-radius: 12px;
        border: 1px solid var(--glass-border);
    }
    .filter-tab {
        padding: 0.5rem 1rem;
        border: none; background: transparent;
        color: var(--muted);
        cursor: pointer; border-radius: 8px;
        font-size: 0.85rem; font-weight: 600;
        font-family: inherit;
        transition: all 0.2s ease;
        white-space: nowrap;
    }
    .filter-tab:hover { color: var(--text); }
    .filter-tab.active {
        background: linear-gradient(135deg, var(--accent-1), #5b8cff);
        color: white;
        box-shadow: 0 4px 12px rgba(124,92,255,0.3);
    }

    /* ====================================================
       TESTS GRID
       ==================================================== */
    .tests-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1.2rem;
    }
    .test-card {
        padding: 1.6rem;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        display: flex; flex-direction: column;
        position: relative; overflow: hidden;
    }
    .test-card::before {
        content: ""; position: absolute; inset: 0;
        background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%), rgba(124,92,255,0.15), transparent 40%);
        opacity: 0; transition: opacity 0.4s ease;
        pointer-events: none;
    }
    .test-card:hover::before { opacity: 1; }
    .test-card:hover {
        transform: translateY(-6px);
        border-color: rgba(124,92,255,0.35);
        background: var(--card-hover);
    }
    .test-header-row {
        display: flex; justify-content: space-between;
        align-items: flex-start;
        gap: 0.6rem;
        margin-bottom: 0.8rem;
    }
    .test-card h3 {
        color: var(--text);
        font-size: 1.1rem; font-weight: 700;
        letter-spacing: -0.01em;
        flex: 1;
    }
    .test-badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.25rem 0.6rem;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        white-space: nowrap;
    }
    .test-badge.done { background: rgba(16,185,129,0.15); color: #10b981; }
    .test-badge.new { background: rgba(124,92,255,0.15); color: #c4b5fd; }

    .test-card p {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1rem;
        flex: 1;
        line-height: 1.5;
    }

    .test-meta {
        display: flex;
        gap: 1rem;
        font-size: 0.8rem;
        color: var(--muted-2);
        margin-bottom: 1rem;
    }

    .start-btn {
        padding: 0.75rem 1.3rem;
        background: linear-gradient(135deg, var(--accent-1), #5b8cff);
        color: white;
        text-decoration: none;
        text-align: center;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        box-shadow: 0 8px 24px rgba(124,92,255,0.3);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .start-btn::before {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
    }
    .start-btn:hover::before { transform: translateX(100%); }
    .start-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(124,92,255,0.5);
    }
    .start-btn.completed {
        background: rgba(16,185,129,0.15);
        color: #10b981;
        border: 1px solid rgba(16,185,129,0.3);
        box-shadow: none;
    }
    .start-btn.completed:hover { background: rgba(16,185,129,0.25); }

    /* ====================================================
       RESULTS LIST
       ==================================================== */
    .results-list {
        display: flex; flex-direction: column;
        gap: 0.8rem;
    }
    .result-item {
        padding: 1.1rem 1.4rem;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        display: flex; justify-content: space-between;
        align-items: center;
        backdrop-filter: blur(10px);
        text-decoration: none; color: inherit;
        transition: all 0.3s ease;
    }
    .result-item:hover {
        background: var(--card-hover);
        border-color: rgba(255,255,255,0.15);
        transform: translateX(6px);
    }
    .result-item strong {
        font-weight: 600; font-size: 1rem;
        color: var(--text);
    }
    .result-score {
        font-weight: 700;
        color: var(--success);
        font-size: 1.1rem;
        padding: 0.4rem 0.9rem;
        background: rgba(16,185,129,0.1);
        border: 1px solid rgba(16,185,129,0.2);
        border-radius: 10px;
    }
    .result-score.low { color: #f59e0b; background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.2); }
    .result-score.fail { color: #ef4444; background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.2); }
    .result-date {
        font-size: 0.8rem;
        color: var(--muted-2);
        margin-top: 0.3rem;
    }

    /* ====================================================
       EMPTY STATE
       ==================================================== */
    .empty {
        text-align: center;
        padding: 2.5rem 2rem;
        color: var(--muted);
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 14px;
        font-size: 0.95rem;
        grid-column: 1 / -1;
    }
    .empty .big-icon { font-size: 2.5rem; margin-bottom: 0.6rem; opacity: 0.6; }
    .empty h3 { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; }
    .empty p { font-size: 0.9rem; color: var(--muted); }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ====================================================
       RESPONSIVE
       ==================================================== */
    @media (max-width: 768px) {
        .brand-text { display: none; }
        .user-chip span.email { display: none; }
        .main-content { padding: 1.5rem 1rem; }
        .welcome-card { padding: 1.5rem; }
        .welcome-card h1 { font-size: 1.4rem; }
        .section-header { flex-direction: column; align-items: stretch; }
        .search-box { max-width: 100%; }
        .filter-tabs { overflow-x: auto; }
        .stats-grid { grid-template-columns: 1fr 1fr; }
        .tests-grid { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<!-- GLOBAL LOADER -->
<div id="globalLoader" class="hidden">
    <div class="loader-circle"></div>
    <div class="loader-text">Loading...</div>
</div>

<!-- Background -->
<div class="bg-wrap"></div>
<div class="grid-overlay"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<!-- ============ TOPBAR ============ -->
<div class="topbar">
    <div class="topbar-left">
        <button class="hamburger" id="hamburgerBtn" title="Open menu">☰</button>
        <!-- 🔥 Icon click = page reload -->
        <div class="brand" onclick="window.location.reload()">
            <div class="brand-logo">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='📝';">
            </div>
            <span class="brand-text">MockTest</span>
        </div>
    </div>
    <div class="topbar-right">
        <!-- 🔥 User chip — clickable (opens sidebar) -->
        <div class="user-chip" id="userChipBtn" title="Open menu">
            <div class="avatar" id="userAvatar">?</div>
            <span class="email" id="userEmail">...</span>
        </div>
    </div>
</div>

<!-- ============ SIDEBAR OVERLAY ============ -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ============ SIDEBAR ============ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <!-- 🔥 Sidebar logo click = page reload -->
        <div class="sidebar-brand" onclick="window.location.reload()" style="cursor:pointer;">
            <div class="sidebar-brand-logo">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'; this.parentElement.innerHTML='📝';">
            </div>
            <span class="sidebar-brand-text">MockTest</span>
        </div>
        <button class="sidebar-close" id="sidebarCloseBtn">✕</button>
    </div>

    <div class="sidebar-menu">
        <div class="sidebar-section-title">MAIN MENU</div>
        <button class="sidebar-item active" data-tab="dashboard">
            <span class="sidebar-icon">📊</span>
            <span>Dashboard</span>
        </button>
        <button class="sidebar-item" data-tab="tests">
            <span class="sidebar-icon">📝</span>
            <span>Tests</span>
        </button>
        <button class="sidebar-item" data-tab="results">
            <span class="sidebar-icon">📋</span>
            <span>Results</span>
        </button>
    </div>

    <div class="sidebar-footer">
        <button class="sidebar-item danger" id="logoutBtn">
            <span class="sidebar-icon">🚪</span>
            <span>Logout</span>
        </button>
    </div>
</aside>

<!-- ============ MAIN CONTENT ============ -->
<div class="main-content">

    <!-- DASHBOARD TAB -->
    <div class="tab-panel active" id="panel-dashboard">
        <div class="welcome-card">
            <div class="welcome-content">
                <div class="welcome-badge">✨ Your Dashboard</div>
                <h1>Welcome, <span id="welcomeName">Student</span>! 👋</h1>
                <p>Ready to practice? Take a test and track your progress.</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-value" id="statTests">0</div>
                <div class="stat-label">Available Tests</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-value" id="statAttempted">0</div>
                <div class="stat-label">Tests Attempted</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎯</div>
                <div class="stat-value" id="statAvg">0%</div>
                <div class="stat-label">Average Score</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="statBest">0%</div>
                <div class="stat-label">Best Score</div>
            </div>
        </div>
    </div>

    <!-- TESTS TAB -->
    <div class="tab-panel" id="panel-tests">
        <div class="section-header">
            <h2>📝 Available Tests</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search tests...">
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="pending">Pending</button>
                <button class="filter-tab" data-filter="completed">Completed</button>
            </div>
        </div>
        <div class="tests-grid" id="testsGrid"></div>
    </div>

    <!-- RESULTS TAB -->
    <div class="tab-panel" id="panel-results">
        <div class="section-header">
            <h2>📋 My Results</h2>
        </div>
        <div class="results-list" id="resultsList"></div>
    </div>

</div>

<script src="js/config.js"></script>
<script>
    // ============ GLOBAL LOADER ============
    const globalLoader = document.getElementById('globalLoader');
    const loaderText = globalLoader.querySelector('.loader-text');
    function showPageLoader(msg = 'Loading...') {
        loaderText.textContent = msg;
        globalLoader.classList.remove('hidden');
    }
    function hidePageLoader() {
        setTimeout(() => globalLoader.classList.add('hidden'), 200);
    }

    // ============ SIDEBAR CONTROL ============
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
    const userChipBtn = document.getElementById('userChipBtn');

    function openSidebar() {
        sidebar.classList.add('active');
        sidebarOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';  // 🔥 Body scroll lock
    }
    function closeSidebar() {
        sidebar.classList.remove('active');
        sidebarOverlay.classList.remove('active');
        document.body.style.overflow = '';  // 🔥 Restore scroll
    }
    hamburgerBtn.onclick = openSidebar;
    sidebarCloseBtn.onclick = closeSidebar;
    sidebarOverlay.onclick = closeSidebar;
    userChipBtn.onclick = openSidebar;  // 🔥 User chip click = sidebar open

    // ============ STATE ============
    let allTests = [];
    let allResults = [];
    let currentFilter = 'all';
    let currentSearch = '';
    let userEmail = '';
    let dashboardLoaded = false;
    let testsLoaded = false;
    let resultsLoaded = false;

    // ============ TAB SWITCH ============
    async function switchTab(tab, showLoader = true) {
        closeSidebar();

        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        const panel = document.getElementById('panel-' + tab);
        if (panel) panel.classList.add('active');

        document.querySelectorAll('.sidebar-item[data-tab]').forEach(item => {
            item.classList.toggle('active', item.dataset.tab === tab);
        });

        if (tab === 'dashboard') {
            if (showLoader && !dashboardLoaded) showPageLoader('Loading dashboard...');
            await loadDashboardData();
            dashboardLoaded = true;
            if (showLoader) hidePageLoader();
        } else if (tab === 'tests') {
            if (showLoader) showPageLoader('Loading tests...');
            await loadTestsData();
            testsLoaded = true;
            if (showLoader) hidePageLoader();
        } else if (tab === 'results') {
            if (showLoader) showPageLoader('Loading results...');
            await loadResultsData();
            resultsLoaded = true;
            if (showLoader) hidePageLoader();
        }
    }

    document.querySelectorAll('.sidebar-item[data-tab]').forEach(item => {
        item.onclick = () => switchTab(item.dataset.tab, true);
    });

    // ============ AUTH CHECK & INIT ============
    (async () => {
        showPageLoader('Verifying access...');

        const user = await requireAuth();
        if (!user) return;

        userEmail = user.email || '';
        document.getElementById('userEmail').textContent = userEmail;

        const name = userEmail.split('@')[0] || 'Student';
        const prettyName = name.charAt(0).toUpperCase() + name.slice(1);
        document.getElementById('welcomeName').textContent = prettyName;
        document.getElementById('userAvatar').textContent = prettyName.charAt(0).toUpperCase();

        await loadDashboardData();
        dashboardLoaded = true;

        hidePageLoader();
    })();

    // ============ LOAD DASHBOARD ============
    async function loadDashboardData() {
        const [testsData, resultsData] = await Promise.all([
            apiCall('/api/tests/list'),
            apiCall('/api/results/my')
        ]);

        allTests = testsData.success ? testsData.tests : [];
        allResults = resultsData.success ? resultsData.results : [];

        updateStats();
    }

    // ============ LOAD TESTS ============
    async function loadTestsData() {
        const testsData = await apiCall('/api/tests/list');
        allTests = testsData.success ? testsData.tests : [];

        if (!allResults.length) {
            const resultsData = await apiCall('/api/results/my');
            allResults = resultsData.success ? resultsData.results : [];
        }

        renderTests();
    }

    // ============ LOAD RESULTS ============
    async function loadResultsData() {
        const resultsData = await apiCall('/api/results/my');
        allResults = resultsData.success ? resultsData.results : [];
        renderResults();
    }

    // ============ UPDATE STATS ============
    function updateStats() {
        document.getElementById('statTests').textContent = allTests.length;
        document.getElementById('statAttempted').textContent = allResults.length;

        if (allResults.length > 0) {
            const totalScore = allResults.reduce((a, r) => a + r.score, 0);
            const totalMax = allResults.reduce((a, r) => a + r.total, 0);
            const avg = totalMax > 0 ? Math.round((totalScore / totalMax) * 100) : 0;
            document.getElementById('statAvg').textContent = avg + '%';

            const best = Math.max(...allResults.map(r => r.total > 0 ? (r.score / r.total) * 100 : 0));
            document.getElementById('statBest').textContent = Math.round(best) + '%';
        } else {
            document.getElementById('statAvg').textContent = '0%';
            document.getElementById('statBest').textContent = '0%';
        }
    }

    // ============ HELPERS ============
    function getTestIdFromResult(r) {
        return r.test_id || (r.tests && r.tests.id);
    }

    function getCompletedTestIds() {
        return new Set(allResults.map(r => getTestIdFromResult(r)).filter(Boolean));
    }

    // ============ RENDER TESTS ============
    function renderTests() {
        const grid = document.getElementById('testsGrid');
        const completedIds = getCompletedTestIds();

        let filtered = allTests.filter(t => {
            if (currentSearch) {
                const s = currentSearch.toLowerCase();
                const matchesSearch =
                    (t.title || '').toLowerCase().includes(s) ||
                    (t.description || '').toLowerCase().includes(s);
                if (!matchesSearch) return false;
            }
            if (currentFilter === 'pending') return !completedIds.has(t.id);
            if (currentFilter === 'completed') return completedIds.has(t.id);
            return true;
        });

        if (filtered.length === 0) {
            if (allTests.length === 0) {
                grid.innerHTML = `
                    <div class="empty">
                        <div class="big-icon">📭</div>
                        <h3>No tests available</h3>
                        <p>Please check back later.</p>
                    </div>
                `;
            } else {
                grid.innerHTML = `
                    <div class="empty">
                        <div class="big-icon">🔍</div>
                        <h3>No matching tests</h3>
                        <p>Try a different search or filter.</p>
                    </div>
                `;
            }
            return;
        }

        grid.innerHTML = filtered.map(t => {
            const isCompleted = completedIds.has(t.id);
            const duration = t.duration_minutes || 30;
            const badge = isCompleted ? 'done' : 'new';
            const badgeText = isCompleted ? '✓ Done' : 'New';

            return `
                <div class="test-card" data-test-id="${t.id}">
                    <div class="test-header-row">
                        <h3>${escapeHtml(t.title)}</h3>
                        <span class="test-badge ${badge}">${badgeText}</span>
                    </div>
                    <p>${escapeHtml(t.description || 'No description available')}</p>
                    <div class="test-meta">
                        <span>⏱ ${duration} min</span>
                        ${isCompleted ? '<span>✅ Attempted</span>' : '<span>🆕 Not attempted</span>'}
                    </div>
                    <a href="test.html?id=${t.id}" class="start-btn ${isCompleted ? 'completed' : ''}">
                        ${isCompleted ? 'Retake Test' : 'Start Test'}
                    </a>
                </div>
            `;
        }).join('');

        grid.querySelectorAll('.test-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
                card.style.setProperty('--my', (e.clientY - rect.top) + 'px');
            });
        });
    }

    // ============ RENDER RESULTS ============
    function renderResults() {
        const list = document.getElementById('resultsList');
        if (!allResults.length) {
            list.innerHTML = `
                <div class="empty">
                    <div class="big-icon">📊</div>
                    <h3>No results yet</h3>
                    <p>Start your first test to see results here!</p>
                </div>
            `;
            return;
        }

        const recent = allResults.slice(0, 20);

        list.innerHTML = recent.map(r => {
            const pct = r.total > 0 ? (r.score / r.total) * 100 : 0;
            let scoreClass = '';
            if (pct < 40) scoreClass = 'fail';
            else if (pct < 60) scoreClass = 'low';

            return `
                <a class="result-item" href="result.html?id=${r.id}">
                    <div>
                        <strong>${escapeHtml(r.tests?.title || 'Test')}</strong>
                        <div class="result-date">${new Date(r.created_at).toLocaleString()}</div>
                    </div>
                    <div class="result-score ${scoreClass}">${r.score}/${r.total}</div>
                </a>
            `;
        }).join('');
    }

    // ============ FILTER TABS ============
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.dataset.filter;
            renderTests();
        };
    });

    // ============ SEARCH ============
    document.getElementById('searchInput').addEventListener('input', (e) => {
        currentSearch = e.target.value.trim();
        renderTests();
    });

    // ============ LOGOUT → index.html ============
    document.getElementById('logoutBtn').onclick = async function() {
        if (!confirm('Logout? You will need to login again.')) return;

        // 🔥 Full data clear
        try {
            sessionStorage.clear();
            localStorage.clear();
        } catch (e) { }

        try {
            await apiCall('/api/auth/logout', { method: 'POST' });
        } catch (e) { }

        window.location.href = 'index.html';
    };

    // ============ PAGE REFRESH PROTECTION ============
    window.addEventListener('pageshow', async (event) => {
        if (event.persisted) {
            const user = await apiCall('/api/auth/me');
            if (!user.success) {
                window.location.href = 'login.html';
            }
        }
    });

    // 🔥 BLOCK direct access if not logged in
    window.addEventListener('load', async () => {
        const user = await apiCall('/api/auth/me');
        if (!user.success) {
            window.location.href = 'login.html';
        }
    });
</script>
</body>
</html>
