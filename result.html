<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result - MockTest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg: #0a0a0f; --bg-2: #12121a; --text: #ffffff;
        --muted: rgba(255,255,255,0.65);
        --accent-1: #7c5cff;
        --glass: rgba(255,255,255,0.04);
        --glass-border: rgba(255,255,255,0.08);
        --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    }
    html, body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg); color: var(--text);
        min-height: 100vh; overflow-x: hidden;
    }
    .bg-wrap {
        position: fixed; inset: 0; z-index: -1; overflow: hidden;
        background:
            radial-gradient(1000px 500px at 70% -10%, rgba(124,92,255,0.2), transparent 60%),
            radial-gradient(800px 450px at -10% 40%, rgba(34,211,238,0.15), transparent 60%),
            var(--bg);
    }
    .grid-overlay {
        position: fixed; inset: 0; z-index: -1;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }
    .orb {
        position: fixed; border-radius: 50%; filter: blur(80px);
        opacity: 0.4; z-index: -1;
        animation: float 18s ease-in-out infinite;
    }
    .orb.o1 { width: 380px; height: 380px; background: #7c5cff; top: -100px; left: -100px; }
    .orb.o2 { width: 320px; height: 320px; background: #22d3ee; bottom: 20%; right: -80px; animation-delay: -6s; }
    @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-20px)} }

    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }

    .card {
        padding: 2.5rem 2rem;
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        text-align: center;
        margin-bottom: 2rem;
        animation: fadeUp 0.6s ease;
    }
    .icon {
        font-size: 3.5rem; margin-bottom: 1rem; display: inline-block;
        animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    @keyframes bounceIn { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    h1 {
        font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem;
        background: linear-gradient(90deg, #fff, #c4b5fd);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .test-name { color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem; }

    .score-circle {
        width: 170px; height: 170px; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        margin: 0 auto 1.5rem; font-size: 2.2rem; font-weight: 800;
        position: relative;
        background: conic-gradient(var(--score-color, var(--success)) var(--pct, 0%), rgba(255,255,255,0.08) 0);
        box-shadow: 0 0 40px rgba(124,92,255,0.15);
    }
    .score-circle::before {
        content: ''; position: absolute; inset: 10px;
        background: var(--bg-2); border-radius: 50%;
        border: 1px solid var(--glass-border);
    }
    .score-circle span { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 0.2rem; }
    .score-slash { opacity: 0.5; font-size: 1.2rem; }

    .percentage { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.4rem; }
    .status-msg { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat {
        background: var(--glass); border: 1px solid var(--glass-border);
        padding: 1.2rem 1rem; border-radius: 14px;
    }
    .stat-value { font-size: 1.6rem; font-weight: 800; }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }

    .actions { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
    .actions a {
        padding: 0.9rem 1.5rem; border-radius: 12px;
        text-decoration: none; font-weight: 600; font-size: 0.95rem;
        transition: all 0.3s ease;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent-1), #5b8cff); color: white; }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary { background: var(--glass); color: var(--text); border: 1px solid var(--glass-border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.08); }

    .analysis-section {
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 2rem 1.5rem;
        animation: fadeUp 0.8s ease;
    }
    .analysis-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    .analysis-header h2 { font-size: 1.3rem; font-weight: 700; }
    .filter-btns {
        display: flex; gap: 0.3rem; background: var(--glass);
        padding: 0.3rem; border-radius: 10px;
        border: 1px solid var(--glass-border);
    }
    .filter-btn {
        padding: 0.5rem 1rem; border: none; background: transparent;
        color: var(--muted); cursor: pointer; border-radius: 8px;
        font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
    }
    .filter-btn.active { background: rgba(124,92,255,0.2); color: #c4b5fd; }

    .question-item {
        background: var(--glass); border: 1px solid var(--glass-border);
        border-radius: 14px; padding: 1.3rem; margin-bottom: 1rem;
        border-left: 4px solid; transition: all 0.2s;
    }
    .question-item.correct { border-left-color: var(--success); }
    .question-item.wrong { border-left-color: var(--danger); }
    .question-item.skipped { border-left-color: var(--warning); }

    .q-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; }
    .q-number {
        font-size: 0.8rem; background: rgba(124,92,255,0.2);
        color: #c4b5fd; padding: 0.25rem 0.6rem;
        border-radius: 6px; font-weight: 700;
    }
    .q-status {
        font-size: 0.75rem; font-weight: 700;
        padding: 0.25rem 0.6rem; border-radius: 6px;
        text-transform: uppercase; letter-spacing: 0.05em;
    }
    .q-status.correct { background: rgba(16,185,129,0.2); color: #10b981; }
    .q-status.wrong { background: rgba(239,68,68,0.2); color: #ef4444; }
    .q-status.skipped { background: rgba(245,158,11,0.2); color: #f59e0b; }

    .q-text { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.5; }
    .option {
        padding: 0.7rem 1rem; border-radius: 8px; margin-bottom: 0.5rem;
        font-size: 0.9rem; display: flex; align-items: flex-start;
        gap: 0.6rem; border: 1px solid transparent;
    }
    .option.correct-answer { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); }
    .option.user-wrong { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); }
    .option-letter { font-weight: 700; color: var(--muted); min-width: 20px; }
    .option.correct-answer .option-letter { color: #10b981; }
    .option.user-wrong .option-letter { color: #ef4444; }

    .q-footer {
        display: flex; gap: 1rem; margin-top: 0.8rem;
        font-size: 0.85rem; color: var(--muted); flex-wrap: wrap;
    }
    .q-footer strong { color: var(--text); }
    .empty { text-align: center; padding: 2rem; color: var(--muted); }

    @media (max-width: 600px) {
        .card { padding: 2rem 1.5rem; }
        h1 { font-size: 1.5rem; }
        .score-circle { width: 140px; height: 140px; font-size: 1.8rem; }
        .stats { grid-template-columns: 1fr; }
        .analysis-header { flex-direction: column; align-items: flex-start; }
    }
</style>
</head>
<body>

<div class="bg-wrap"></div>
<div class="grid-overlay"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>

<div class="container">
    <div class="card" id="card">
        <div class="icon">⏳</div>
        <h1>Analyzing...</h1>
    </div>

    <div class="analysis-section" id="analysisSection" style="display: none;">
        <div class="analysis-header">
            <h2>📋 Question-wise Analysis</h2>
            <div class="filter-btns">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="correct">✅ Correct</button>
                <button class="filter-btn" data-filter="wrong">❌ Wrong</button>
                <button class="filter-btn" data-filter="skipped">⏭ Skipped</button>
            </div>
        </div>
        <div id="questionsList"></div>
    </div>
</div>

<script src="js/config.js"></script>
<script>
    autoRestoreFullscreen();
    createFullscreenIndicator();

    const params = new URLSearchParams(window.location.search);
    const RESULT_ID = params.get('id');

    (async () => {
        const user = await requireAuth();
        if (!user) return;
        if (!RESULT_ID) { window.location.href = 'dashboard.html'; return; }

        const data = await apiCall(`/api/results/${RESULT_ID}`);
        if (!data.success || !data.result) {
            document.getElementById('card').innerHTML = `
                <div class="icon">⚠️</div>
                <h1>Result Not Found</h1>
                <div class="actions" style="margin-top: 2rem;">
                    <a href="dashboard.html" class="btn-primary">Go to Dashboard</a>
                </div>
            `;
            return;
        }

        renderSummary(data.result);

        const details = await apiCall(`/api/results/${RESULT_ID}/details`);
        if (details.success && details.questions) {
            renderQuestions(details.questions);
            document.getElementById('analysisSection').style.display = 'block';
        }
    })();

    function renderSummary(r) {
        const pct = r.total > 0 ? (r.score / r.total) * 100 : 0;
        const passed = pct >= 40;
        let emoji, msg, color;
        if (pct >= 80) { emoji = '🏆'; msg = 'Outstanding performance!'; color = '#10b981'; }
        else if (pct >= 60) { emoji = '🎉'; msg = 'Great job! Keep it up.'; color = '#10b981'; }
        else if (pct >= 40) { emoji = '👍'; msg = 'Good effort! A little more practice.'; color = '#f59e0b'; }
        else { emoji = '📚'; msg = 'Keep practicing! You will get there.'; color = '#ef4444'; }
        const wrong = r.total - r.score;

        document.getElementById('card').innerHTML = `
            <div class="icon">${emoji}</div>
            <h1>${passed ? 'Test Passed' : 'Test Completed'}</h1>
            <p class="test-name">${escapeHtml(r.tests?.title || 'Test')}</p>
            <div class="score-circle" style="--pct: ${pct}%; --score-color: ${color}">
                <span>${r.score}<span class="score-slash">/</span>${r.total}</span>
            </div>
            <div class="percentage" style="color: ${color}">${pct.toFixed(1)}%</div>
            <p class="status-msg">${msg}</p>
            <div class="stats">
                <div class="stat"><div class="stat-value" style="color:#10b981;">${r.score}</div><div class="stat-label">Correct</div></div>
                <div class="stat"><div class="stat-value" style="color:#ef4444;">${wrong}</div><div class="stat-label">Wrong</div></div>
                <div class="stat"><div class="stat-value" style="color:#7c5cff;">${r.total}</div><div class="stat-label">Total</div></div>
            </div>
            <div class="actions">
                <a href="dashboard.html" class="btn-primary">Back to Dashboard</a>
                <a href="test.html?id=${r.test_id}" class="btn-secondary">Retake Test</a>
            </div>
        `;
    }

    function renderQuestions(questions) {
        const list = document.getElementById('questionsList');
        if (!questions.length) {
            list.innerHTML = '<div class="empty">No detailed analysis available for this result.</div>';
            return;
        }
        list.innerHTML = questions.map((q, i) => {
            const selected = q.selected_option || '';
            const correct = q.correct_option || '';
            let status = 'skipped';
            if (selected === correct && correct) status = 'correct';
            else if (selected) status = 'wrong';

            const labels = { correct: '✅ Correct', wrong: '❌ Wrong', skipped: '⏭ Skipped' };
            const opts = ['A', 'B', 'C', 'D'];
            const optionsHtml = opts.map(letter => {
                let cls = 'option';
                if (letter === correct) cls += ' correct-answer';
                if (letter === selected && letter !== correct) cls += ' user-wrong';
                return `<div class="${cls}"><span class="option-letter">${letter}.</span><span>${escapeHtml(q['option_' + letter.toLowerCase()] || '')}</span></div>`;
            }).join('');

            return `
                <div class="question-item ${status}" data-status="${status}">
                    <div class="q-header">
                        <span class="q-number">Q${i + 1}</span>
                        <span class="q-status ${status}">${labels[status]}</span>
                    </div>
                    <div class="q-text">${escapeHtml(q.question_text)}</div>
                    <div>${optionsHtml}</div>
                    <div class="q-footer">
                        <span>Your answer: <strong>${selected || 'Not attempted'}</strong></span>
                        <span>Correct answer: <strong style="color:#10b981;">${correct}</strong></span>
                    </div>
                </div>
            `;
        }).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const filter = btn.dataset.filter;
            document.querySelectorAll('.question-item').forEach(item => {
                item.style.display = (filter === 'all' || item.dataset.status === filter) ? 'block' : 'none';
            });
        };
    });
</script>
</body>
</html>
