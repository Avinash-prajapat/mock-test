<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - MockTest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0a0a0f;
        --text: #ffffff;
        --muted: rgba(255,255,255,0.65);
        --muted-2: rgba(255,255,255,0.45);
        --accent-1: #7c5cff;
        --accent-2: #22d3ee;
        --glass: rgba(255,255,255,0.04);
        --glass-border: rgba(255,255,255,0.08);
        --input-bg: rgba(255,255,255,0.06);
        --input-border: rgba(255,255,255,0.12);
        --error: #ef4444;
        --success: #10b981;
    }

    html, body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* ===== Animated Background ===== */
    .bg-wrap {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        background:
            radial-gradient(1000px 500px at 70% -10%, rgba(124,92,255,0.25), transparent 60%),
            radial-gradient(800px 450px at -10% 40%, rgba(34,211,238,0.18), transparent 60%),
            radial-gradient(700px 400px at 50% 110%, rgba(244,114,182,0.15), transparent 60%),
            var(--bg);
    }
    .grid-overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 48px 48px;
        mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    }
    .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        z-index: -1;
        animation: float 18s ease-in-out infinite;
    }
    .orb.o1 { width: 380px; height: 380px; background: #7c5cff; top: -100px; left: -100px; }
    .orb.o2 { width: 320px; height: 320px; background: #22d3ee; bottom: 20%; right: -80px; animation-delay: -6s; }
    .orb.o3 { width: 340px; height: 340px; background: #f472b6; bottom: -120px; left: 20%; animation-delay: -12s; }

    @keyframes float {
        0%, 100% { transform: translate(0,0) scale(1); }
        33% { transform: translate(30px,-20px) scale(1.05); }
        66% { transform: translate(-20px,30px) scale(0.95); }
    }

    /* ===== Layout ===== */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        min-height: 100vh;
    }

    /* ===== Card ===== */
    .box {
        width: 100%;
        max-width: 420px;
        padding: 2.5rem 2rem;
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        animation: fadeUp 0.6s ease;
        position: relative;
        overflow: hidden;
    }
    .box::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(124,92,255,0.5), transparent);
    }

    /* ===== Logo ===== */
    .logo {
        text-align: center;
        margin-bottom: 1.5rem;
    }
    .logo-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
        font-size: 1.5rem;
        box-shadow: 0 8px 24px rgba(124,92,255,0.4);
        position: relative;
        overflow: hidden;
    }
    .logo-icon::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
        transform: translateX(-100%);
        animation: shine 3.5s ease-in-out infinite;
    }
    @keyframes shine {
        0%, 60% { transform: translateX(-100%); }
        80%, 100% { transform: translateX(100%); }
    }

    /* ===== Typography ===== */
    h1 {
        text-align: center;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 0.5rem;
        background: linear-gradient(90deg, #fff, #c4b5fd);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }
    .subtitle {
        text-align: center;
        color: var(--muted);
        margin-bottom: 2rem;
        font-size: 0.95rem;
    }

    /* ===== Form Inputs ===== */
    input {
        width: 100%;
        padding: 0.9rem 1rem;
        margin-bottom: 1rem;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 12px;
        color: var(--text);
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        transition: all 0.3s ease;
    }
    input::placeholder {
        color: var(--muted-2);
    }
    input:focus {
        background: rgba(255,255,255,0.08);
        border-color: var(--accent-1);
        box-shadow: 0 0 0 3px rgba(124,92,255,0.15);
    }

    /* ===== Submit Button ===== */
    button.submit {
        width: 100%;
        padding: 0.95rem;
        background: linear-gradient(135deg, var(--accent-1), #5b8cff);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(124,92,255,0.35);
        position: relative;
        overflow: hidden;
    }
    button.submit::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
        transform: translateX(-100%);
        transition: transform 0.6s ease;
    }
    button.submit:hover:not(:disabled)::before {
        transform: translateX(100%);
    }
    button.submit:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(124,92,255,0.5);
    }
    button.submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    /* ===== Messages ===== */
    .msg {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
        min-height: 20px;
        transition: all 0.3s ease;
    }
    .msg.error {
        color: var(--error);
    }
    .msg.success {
        color: var(--success);
    }

    /* ===== Fullscreen Note ===== */
    .fs-note {
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted-2);
        margin-top: 1.2rem;
        padding: 0.8rem;
        background: rgba(34,211,238,0.08);
        border: 1px solid rgba(34,211,238,0.15);
        border-radius: 10px;
        line-height: 1.5;
    }

    /* ===== Bottom Link ===== */
    .bottom-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--muted);
        font-size: 0.9rem;
    }
    .bottom-link a {
        color: var(--accent-2);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.2s ease;
    }
    .bottom-link a:hover {
        color: #67e8f9;
        text-decoration: underline;
    }

    /* ===== Animations ===== */
    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
        .box {
            padding: 2rem 1.5rem;
        }
        h1 {
            font-size: 1.5rem;
        }
    }
</style>
</head>
<body>

<!-- Background layers -->
<div class="bg-wrap"></div>
<div class="grid-overlay"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>

<div class="box">
    <div class="logo">
        <div class="logo-icon">📝</div>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Login to continue your practice</p>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="submit" id="loginBtn">Login & Enter Fullscreen</button>
        <p class="msg" id="msg"></p>
    </form>

    <p class="fs-note">🔒 Login ke baad exam fullscreen mode me khulega</p>

    <div class="bottom-link">
        Don't have an account? <a href="signup.html">Sign up</a>
    </div>
</div>

<script src="js/config.js"></script>
<script>
    redirectIfLoggedIn();

    if (isFsEnabled()) {
        setTimeout(() => {
            if (!document.fullscreenElement) showResumeOverlay();
        }, 150);
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();

        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('msg');

        let fsEntered = false;
        try {
            if (!document.fullscreenElement) {
                await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
                localStorage.setItem('fs_enabled_v2', '1');
                fsEntered = true;
                console.log('[FS] ✅ Fullscreen entered');
            } else {
                localStorage.setItem('fs_enabled_v2', '1');
                fsEntered = true;
            }
        } catch (err) {
            console.warn('[FS] ❌ Fullscreen failed:', err.message);
        }

        btn.disabled = true;
        msg.textContent = 'Logging in...';
        msg.className = 'msg';

        const data = await apiCall('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value
            })
        });

        if (data.success) {
            msg.textContent = fsEntered
                ? 'Login successful! Entering exam mode...'
                : 'Login successful!';
            msg.className = 'msg success';
            setTimeout(() => window.location.href = 'dashboard.html', 600);
        } else {
            localStorage.removeItem('fs_enabled_v2');
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            msg.textContent = data.error || 'Login failed.';
            msg.className = 'msg error';
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
